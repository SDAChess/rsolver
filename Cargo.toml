[workspace]
members = ["rsolver", "procxy"]
resolver = "3"

[workspace.package]
authors = [
  "Simon Scatton <simon.scatton@outlook.fr>",
  "faukah <fau@faukah.com>",
]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
clap = { version = "4.6.9", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "gzip",
  "http2",
  "rustls",
  "stream",
] }
rusqlite = "0.43.0"
serde = { version = "1.0.229", features = ["derive"] }
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
] }
toml = { version = "1.2.2", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = "0.3.23"
