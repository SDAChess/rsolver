[workspace]
members = ["rsolver", "procxy"]
resolver = "3"

[workspace.package]
authors = [
  "Simon Scatton <simon.scatton@outlook.fr>",
  "faukah <fau@faukah.com>",
]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.2.2", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
